[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beaver-study-orchestrator"
version = "0.1.0"
description = "Study planning orchestration service with syllabus parsing, planning, what-if analysis, and review surfaces."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Doeon Kim"}]
license = "MIT"
dependencies = [
  "fastapi==0.141.1",
  "starlette>=1.3.1",
  "uvicorn[standard]==0.52.1",
  "pydantic==2.13.4",
  "httpx==0.28.1"
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.2"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E402", "E501", "I001"]

[project.urls]
Repository = "https://github.com/KIM3310/beaver-study-orchestrator"
